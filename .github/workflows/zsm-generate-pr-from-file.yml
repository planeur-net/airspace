name: Generate updated ZSM branch from JSON file

on:
  push:
    branches:
      - main
    paths:
      - 'autogenerated/zsm.json'

jobs:
  convert-zsm-file:
    name: Convert pushed ZSM JSON file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute variables
        id: variables
        run: |
          set -euo pipefail

          {
            echo "date=$(date +'%Y-%m-%d-%H:%M:%S')"
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%S')"
            echo "filename=autogenerated/$(date +'%Y-%m-%d-%H-%M-%S')_zsm_openair.txt"
            echo "branch_name=autogenerated/$(date +'%Y-%m-%d-%H-%M-%S')_zsm_openair"
          } >> "$GITHUB_OUTPUT"

      - name: Convert ZSM JSON file
        run: |
          set -euo pipefail

          # Keep the pushed JSON source; replace only generated OpenAir files.
          rm -f autogenerated/*_zsm_openair.txt
          node ./src/zsm/main.js --file autogenerated/zsm.json "${{ steps.variables.outputs.filename }}"

      - name: Insert new ZSM into france-exp.txt
        run: |
          set -euo pipefail

          sed -i '/\* ### ZSM start ###/,/\* ### ZSM stop ###/{//!d}' france-exp.txt
          sed -i '/\* ### ZSM start ###/r ${{ steps.variables.outputs.filename }}' france-exp.txt

      - name: Extract timeStamp
        id: extract-timestamp
        run: |
          set -euo pipefail

          TIMESTAMP=$(head -n 1 "${{ steps.variables.outputs.filename }}" | sed 's/\* timeStamp= //')
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Check for meaningful ZSM changes
        id: zsm-changes
        run: |
          set -euo pipefail

          meaningful=false
          for file in france.txt france-exp.txt; do
            git show "HEAD:${file}" | sed '/^\* timeStamp= /d' > "/tmp/${file}.base"
            sed '/^\* timeStamp= /d' "${file}" > "/tmp/${file}.current"

            if ! cmp -s "/tmp/${file}.base" "/tmp/${file}.current"; then
              meaningful=true
              break
            fi
          done

          echo "meaningful=${meaningful}" >> "$GITHUB_OUTPUT"
          if [ "${meaningful}" = true ]; then
            echo "ZSM definition changes detected."
          else
            echo "No ZSM definition changes detected."
          fi

      - name: Update ZSM history in README
        env:
          EXECUTION_TIMESTAMP: ${{ steps.variables.outputs.timestamp }}
          MEANINGFUL_CHANGE: ${{ steps.zsm-changes.outputs.meaningful }}
        run: |
          set -euo pipefail

          awk \
            -v timestamp="${EXECUTION_TIMESTAMP}" \
            -v meaningful="${MEANINGFUL_CHANGE}" '
            /\| MAJ france-exp\.txt \(ZSM\)\|/ {
              if (meaningful == "true") {
                print "| " timestamp " | MAJ france-exp.txt (ZSM)|"
              } else {
                print
              }
              next
            }
            /\| Contrôle des nouveautés ZSM sur le SIA\|/ {
              print "| " timestamp " | Contrôle des nouveautés ZSM sur le SIA|"
              next
            }
            { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: Discard non-meaningful ZSM changes
        if: steps.zsm-changes.outputs.meaningful == 'false'
        run: |
          set -euo pipefail

          git restore --source=HEAD -- france.txt france-exp.txt
          git restore --source=HEAD -- 'autogenerated/*_zsm_openair.txt'
          git clean -f -- autogenerated/*_zsm_openair.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ZSM from JSON file for ${{ steps.variables.outputs.date }}"
          title: "Update ZSM ${{ steps.extract-timestamp.outputs.timestamp }}"
          body: |
            Convert the pushed autogenerated/zsm.json file to OpenAir and update france-exp.txt.
            No ZSM HTTP download is performed.
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ steps.variables.outputs.branch_name }}
          delete-branch: true
