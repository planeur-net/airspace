name: Generate updated ZSM branch

on: 
    workflow_dispatch:
      inputs:
        ZSM_URL:
          description: 'URL to the ZSM WFS JSON endpoint'     
          required: true
          default: 'https://geo-prod-sofia-vac.sia-france.fr/geoserver/cloud/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=SIA:zone_zsm&outputFormat=application/json&srsName=EPSG:4326'
    schedule:
      - cron: '0 0 1,16 * *'  # Runs on the 1st and 16th of each month at 00:00 UTC (approx. every 15 days) 

jobs:
    Download-Convert-ZSM-File:
        name: Download and convert ZSM file
        runs-on: ubuntu-latest

        steps:
        - name: 🚚 Get latest code
          uses: actions/checkout@v4
          with:
            path: 'airspace'

        - name: Compute variables
          id: variables
          run: |
            {
              echo "date=$(date +'%Y-%m-%d-%H:%M:%S')"
              echo "filename=autogenerated/$(date +'%Y-%m-%d-%H-%M-%S')_zsm_openair.txt"
              echo "branch_name=autogenerated/$(date +'%Y-%m-%d-%H-%M-%S')_zsm_openair"
            } >> "$GITHUB_OUTPUT"        

        - name: Download and convert ZSM file
          id: download-convert
          env:
            # workflow_dispatch inputs are empty on schedule/cron runs, so fall back to the default URL
            ZSM_URL: ${{ github.event.inputs.ZSM_URL || 'https://geo-prod-sofia-vac.sia-france.fr/geoserver/cloud/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=SIA:zone_zsm&outputFormat=application/json&srsName=EPSG:4326' }}
          run: |
            cd airspace
            echo "## Install dependencies"
            npm install
            echo "## Remove old zsm files ..."
            mkdir -p autogenerated
            rm -f autogenerated/*_zsm_openair.txt

            echo "## Downloading and converting file (url: ${ZSM_URL})"
            node ./src/zsm/main.js "${ZSM_URL}" "${{ steps.variables.outputs.filename }}"


        - name: Insert new ZSM into france-exp.txt
          run: |
            cd airspace
            echo "## Remove old ZSM entries from france-exp.txt ..."
            sed -i '/\* ### ZSM start ###/,/\* ### ZSM stop ###/{//!d}' france-exp.txt

            echo "## Insert new ZSM entries ..."
            sed -i '/\* ### ZSM start ###/r  ${{ steps.variables.outputs.filename }}' france-exp.txt

        - name: Extract timeStamp
          id: extract-timestamp
          run: |
            TIMESTAMP=$(head -n 1 airspace/${{ steps.variables.outputs.filename }} | sed 's/\* timeStamp= //')
            echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

        - name: Create Pull Request
          uses: peter-evans/create-pull-request@v6
          with:
            path: ./airspace
            token: ${{ secrets.GITHUB_TOKEN }}
            commit-message: "Add ZSM file for ${{ steps.variables.outputs.date }}"
            title: "Update ZSM ${{ steps.extract-timestamp.outputs.timestamp }}"
            base: ${{ github.event.repository.default_branch }}
            branch: ${{ steps.variables.outputs.branch_name }}
            delete-branch: true