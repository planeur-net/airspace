# Validate OpenAir file on branch change

name: feature/* Validate OpenAir file

# Controls when the workflow will run
on:
  push:
    branches: [ "feature/*",  "autogenerated/*"]
    paths:
      - 'france.txt'
      - 'france-exp.txt'
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      manual_Run:
        description: 'Manually triggered'
        required: true
        default: 'warning'
      input_file:
        description: 'File to validate (france.txt or france-exp.txt)'
        required: true
        default: 'france.txt'

  pull_request:
    branches:
      - main
    paths:
      - 'france.txt'
      - 'france-exp.txt'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# see: https://github.com/marketplace/actions/ftp-deployment
jobs:
  validate-airspace:
    if: github.ref != 'main'
    name: Validate OpenAir changed file
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 🧱 Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - id: changed-file
      name: Determine file to validate
      run: |
        INPUT_FILE=""

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          INPUT_FILE="${{ inputs.input_file }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          INPUT_FILE=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '^france(-exp)?\.txt$' | head -n1)
        else
          INPUT_FILE=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^france(-exp)?\.txt$' | head -n1)
        fi

        if [ -z "$INPUT_FILE" ]; then
          INPUT_FILE="france.txt"
          echo "::warning::No target file detected in changed files; falling back to $INPUT_FILE"
        fi

        GEOJSON_FILE="${INPUT_FILE%.txt}.geojson"
        echo "input_file=$INPUT_FILE" >> "$GITHUB_OUTPUT"
        echo "geojson_file=$GEOJSON_FILE" >> "$GITHUB_OUTPUT"

    - id: validation
      name: Validate selected file + generate .geojson
      run: |
        echo "## Install openaip-openair-parser"
        git clone https://github.com/openAIP/openaip-openair-parser.git
        cd openaip-openair-parser
        npm install
        npm run build
        echo "## Install openaip-openair-parser: Done !"

        echo "## Validating ..."
        rm -f "../${{ steps.changed-file.outputs.geojson_file }}"
        echo "Run validation script"
        node ./dist/cli.js --input-filepath "../${{ steps.changed-file.outputs.input_file }}" --validate --output-filepath "../${{ steps.changed-file.outputs.geojson_file }}" --version 2.0 --warn-if-expired
        SCRIPT_OUTPUT=$(node ./dist/cli.js --input-filepath "../${{ steps.changed-file.outputs.input_file }}" --validate --output-filepath "../${{ steps.changed-file.outputs.geojson_file }}" --version 2.0 --warn-if-expired)
          SCRIPT_RC=$?
          {
            echo "parser_output<<EOF"
            printf '%s\n' "$SCRIPT_OUTPUT"
            echo "EOF"
            echo "parser_rc=$SCRIPT_RC"
            echo "validated_file=${{ steps.changed-file.outputs.input_file }}"
          } >> "$GITHUB_OUTPUT"

    outputs:
      validation-output: ${{ steps.validation.outputs.parser_output }}
      validated_file: ${{ steps.validation.outputs.validated_file }}

  check-validation:
    name: Check Validation - Display and check output
    runs-on: ubuntu-latest
    needs: [validate-airspace]
    steps:
    - name: Display validation output
      run: |
        echo "Validated file=${{ needs.validate-airspace.outputs.validated_file }}"
        echo "Validation output="
        # Use printf with quoting so multiline output is treated as a single argument and not executed line-by-line
        printf '%s\n' "${{ needs.validate-airspace.outputs.validation-output }}"

    - name: Check validation
      if: |
        always() &&
        contains(needs.validate-airspace.outputs.validation-output, 'Error')
      uses: actions/github-script@v3
      with:
        script: |
          core.setFailed('Validation failed ! See Above step for details...')
        


