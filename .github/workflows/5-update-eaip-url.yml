name: 5-update-eaip-url

on:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 4'

jobs:
  update-eaip-url:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update eAIP URLs in README files
        run: npm run update-eaip-urls

      - name: Create Pull Request (if changes detected)
        uses: peter-evans/create-pull-request@v6
        with:
          commit_message: 'chore: update eAIP URLs in README files'
          branch: 'autogenerated/update-eaip-url'
          delete-branch: true
          title: 'chore: update eAIP URLs in README files'
          body: |
            This PR was created automatically by the 5-update-eaip-url workflow.

            It updates AIP France and ENR 5.6 URLs in:
            - README.md
            - README.en.md
